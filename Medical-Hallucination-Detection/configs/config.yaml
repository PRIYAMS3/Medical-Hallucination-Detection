seed: 42

dataset:
  name: UTAustin-AIHealth/MedHallu
  subset: pqa_labeled
  split: train
  split_names:
    - train
    - validation
    - test
  split_column:
  raw_data_dir: data/raw
  processed_data_dir: data/processed
  processed_file_name: medhallu_pqa_labeled_train.csv
  required_columns:
    - Question
    - Knowledge
    - Ground Truth
    - Difficulty Level
    - Hallucinated Answer
    - Category of Hallucination
  question_column: Question
  answer_columns:
    - Ground Truth
    - Hallucinated Answer
  label_column: Difficulty Level
  hallucination_type_column: Category of Hallucination
  evidence_column: Knowledge

models:
  baseline: roberta-base
  biomedical_encoder: microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext
  nli_model: MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli

training:
  batch_size: 16
  learning_rate: 0.00002
  num_epochs: 5
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_sequence_length: 512
  gradient_accumulation_steps: 1
  evaluation_strategy: epoch
  save_strategy: epoch
  early_stopping_patience: 3

paths:
  outputs_dir: outputs
  model_dir: models
  logs_dir: outputs/logs
  dataset_report: outputs/dataset_report.md
  dataset_quality_report: outputs/dataset_quality_report.md
  dataset_statistics_json: outputs/dataset_statistics.json
  dataset_statistics_csv: outputs/dataset_statistics.csv
  tables_dir: outputs/tables
  dataset_summary_tex: outputs/tables/dataset_summary.tex
  checkpoints_dir: outputs/checkpoints
  metrics_dir: outputs/metrics
  figures_dir: outputs/figures

eda:
  figure_dpi: 300
  histogram_bins: 30
  vocabulary_lowercase: true
  vocabulary_columns:
    - Question
    - Ground Truth
    - Hallucinated Answer
    - Knowledge
  semantic_duplicates:
    enabled: true
    model_name: sentence-transformers/all-MiniLM-L6-v2
    text_column: Question
    cosine_threshold: 0.9
    max_examples: 10
    batch_size: 32
    show_progress_bar: false

logging:
  level: INFO
  file_name: training.log
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"

seed: 42

dataset:
  name: UTAustin-AIHealth/MedHallu
  subset: pqa_labeled
  split: train
  split_names:
    - train
    - validation
    - test
  split_column:
  raw_data_dir: data/raw
  processed_data_dir: data/processed
  processed_file_name: medhallu_pqa_labeled_train.csv
  required_columns:
    - Question
    - Knowledge
    - Ground Truth
    - Difficulty Level
    - Hallucinated Answer
    - Category of Hallucination
  question_column: Question
  answer_columns:
    - Ground Truth
    - Hallucinated Answer
  label_column: Difficulty Level
  hallucination_type_column: Category of Hallucination
  evidence_column: Knowledge

dataset_split:
  train_size: 0.70
  validation_size: 0.15
  test_size: 0.15
  random_seed: 42
  stratify_column: "Difficulty Level"
  splits_dir: data/splits
  train_file_name: train.csv
  validation_file_name: validation.csv
  test_file_name: test.csv

models:
  baseline: roberta-base
  biomedical_encoder: microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext
  nli_model: MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli

tfidf_logistic:
  input_columns:
    question: Question
    knowledge: Knowledge
    hallucinated_answer: Hallucinated Answer
  target_column: Difficulty Level
  class_order:
    - easy
    - medium
    - hard
  text_template: "Question:\n{question}\n\nKnowledge:\n{knowledge}\n\nHallucinated Answer:\n{hallucinated_answer}"
  model_path: outputs/models/tfidf_logistic.pkl
  validation_metrics_path: outputs/results/tfidf_validation_metrics.json
  test_metrics_path: outputs/results/tfidf_test_metrics.json
  validation_confusion_matrix_path: outputs/figures/confusion_matrix_validation.png
  test_confusion_matrix_path: outputs/figures/confusion_matrix_test.png
  figure_dpi: 300
  tfidf:
    lowercase: true
    strip_accents: unicode
    analyzer: word
    ngram_range:
      - 1
      - 2
    max_features: 50000
    min_df: 2
    max_df: 0.95
    sublinear_tf: true
  logistic_regression:
    C: 1.0
    penalty: l2
    solver: lbfgs
    max_iter: 1000
    class_weight: balanced
    multi_class: auto
    n_jobs:
    random_state: 42

training:
  batch_size: 16
  learning_rate: 0.00002
  num_epochs: 5
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_sequence_length: 512
  gradient_accumulation_steps: 1
  evaluation_strategy: epoch
  save_strategy: epoch
  early_stopping_patience: 3

paths:
  outputs_dir: outputs
  model_dir: models
  logs_dir: outputs/logs
  dataset_report: outputs/dataset_report.md
  dataset_quality_report: outputs/dataset_quality_report.md
  dataset_statistics_json: outputs/dataset_statistics.json
  dataset_statistics_csv: outputs/dataset_statistics.csv
  tables_dir: outputs/tables
  dataset_summary_tex: outputs/tables/dataset_summary.tex
  checkpoints_dir: outputs/checkpoints
  metrics_dir: outputs/metrics
  figures_dir: outputs/figures
  split_statistics_json: outputs/split_statistics.json
  split_report: outputs/split_report.md

eda:
  figure_dpi: 300
  histogram_bins: 30
  vocabulary_lowercase: true
  vocabulary_columns:
    - Question
    - Ground Truth
    - Hallucinated Answer
    - Knowledge
  semantic_duplicates:
    enabled: true
    model_name: sentence-transformers/all-MiniLM-L6-v2
    text_column: Question
    cosine_threshold: 0.9
    max_examples: 10
    batch_size: 32
    show_progress_bar: false

logging:
  level: INFO
  file_name: training.log
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
tfidf:
  lowercase: true
  strip_accents: unicode
  analyzer: word
  stop_words: english
  ngram_range: [1, 2]
  max_features: 75000
  min_df: 2
  max_df: 0.95
  sublinear_tf: true

logistic_regression:
  C: 1.0
  penalty: l2
  solver: lbfgs
  max_iter: 2000
  class_weight: balanced
  multi_class: multinomial
  random_state: 42
  n_jobs: -1
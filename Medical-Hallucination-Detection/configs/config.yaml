seed: 42

dataset:
  name: UTAustin-AIHealth/MedHallu
  subset: pqa_labeled
  split: train
  raw_data_dir: data/raw
  processed_data_dir: data/processed
  processed_file_name: medhallu_pqa_labeled_train.csv
  required_columns:
    - Question
    - Knowledge
    - Ground Truth
    - Difficulty Level
    - Hallucinated Answer
    - Category of Hallucination
  question_column: Question
  answer_columns:
    - Ground Truth
    - Hallucinated Answer
  label_column: Difficulty Level
  hallucination_type_column: Category of Hallucination

models:
  baseline: roberta-base
  biomedical_encoder: microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext
  nli_model: MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli

training:
  batch_size: 16
  learning_rate: 0.00002
  num_epochs: 5
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_sequence_length: 512
  gradient_accumulation_steps: 1
  evaluation_strategy: epoch
  save_strategy: epoch
  early_stopping_patience: 3

paths:
  outputs_dir: outputs
  model_dir: models
  logs_dir: outputs/logs
  dataset_report: outputs/dataset_report.md
  checkpoints_dir: outputs/checkpoints
  metrics_dir: outputs/metrics
  figures_dir: outputs/figures

logging:
  level: INFO
  file_name: training.log
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
